name: Lint Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flake8

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=node_modules,migrations,djangoenv

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: find ./server/database -name "*.js" -not -path "*/node_modules/*" -exec jshint --config .jshintrc {} +
